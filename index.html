<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひら先生ポケット｜不登校を笑いながら越えていく</title>
  <style>
    :root {
      /* ひら先生LP準拠：やさしいナチュラルグリーン系 */
      --primary-color: #4A7C72;
      --primary-soft: #EEF5F3;
      --primary-border: #C5D8D3;
      --user-bubble: #D5E4E0;
      --bot-bubble: #FFFFFF;
      --bg-gradient: linear-gradient(145deg, #F4F8F7 0%, #E9F1EF 100%);
      --text-main: #354542;
      --text-sub: #687A76;
      --border-color: #E2ECE9;
      --shadow-sm: 0 2px 10px rgba(74, 124, 114, 0.06);
      --shadow-md: 0 10px 30px rgba(74, 124, 114, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 94vh;
      max-height: 800px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .chat-header {
      background: #FFFFFF;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--border-color);
    }
    .header-profile { display: flex; align-items: center; gap: 12px; }
    .avatar-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-border);
      background: #FFFFFF;
      flex-shrink: 0;
    }
    .header-info h1 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }
    .header-info p {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .chat-messages {
      flex: 1;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #FAFBFB;
      scrollbar-width: thin;
    }
    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--primary-border);
      flex-shrink: 0;
      margin-top: 2px;
      background: #FFFFFF;
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.68;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }
    .msg.bot .msg-bubble {
      background: var(--bot-bubble);
      color: var(--text-main);
      border-top-left-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .msg.user .msg-bubble {
      background: var(--user-bubble);
      color: #273835;
      border-top-right-radius: 4px;
    }
    .loading-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .quick-chips {
      padding: 10px 14px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      background: #FAFBFB;
      border-top: 1px solid var(--border-color);
    }
    .chip-btn {
      background: #FFFFFF;
      border: 1px solid var(--primary-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .chip-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary-color);
    }
    .chat-input-area {
      padding: 12px 14px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      border: 1px solid var(--primary-border);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      background: #F4F8F7;
      color: var(--text-main);
    }
    .chat-input:focus {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .send-btn {
      background: var(--primary-color);
      border: none;
      color: #FFFFFF;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>

# 会話の雰囲気・トーン
- 礼儀正しく上品な敬語（です・ます調）を徹底し、決して馴れ馴れしいタメ口（「うん」「そうだね」「〜だよね」等）は使いません。
- あたたかく優しく包み込み、じっくりと話を聴き、ホッと安心できるトーンを保ちます。
- 共感だけで終わらせず、必要に応じて「視点を変えるヒント」や「親としての心構え」を優しく、しかし芯を持ってお伝えします。

# 一番伝えたい基本マインド
- 「不登校でも大丈夫。」
- 「焦らず行こう。」
- 「不登校を、笑いながら越えていく。」
- お母さんが自分を責める必要はまったくありません。親が笑顔を取り戻すことが、子どもの一番の安心につながります。

# よく使う表現・言葉選び
- 相談してくださったことへの感謝：「お話ししてくださり、ありがとうございます」
- 日々の労い：「今日も本当にお疲れ様です」「毎日よく向き合っておられますね」
- 共感と寄り添い：「そのように感じられるのは、とても自然なことです」「胸が苦しくなりますよね」
- 前向きな導き：「焦らなくて大丈夫ですよ。一歩ずつ、一緒に整理していきましょうね」

# 表記ルール（ひらがな指定）
- 「温かい」→「あたたかい」
- 「子供」→「子ども」
- 「時」→「とき」
- 「頑張る」→「がんばる」
- 「辛い」→「つらい」

# 絶対に使わない言葉（NGワード）
- 「うん」「うん、」「〜かな」（タメ口や軽すぎる相づちは禁止）
- 「〜すべき」「〜しなければならない」（決めつけ・強要）
- 「お母さんのせい」「お母さんの育て方が悪い」（自責を促す表現）
- 相談者やお子さんの感情や行動を頭ごなしに否定・非難する言葉
- 「がんばれ」「もっとがんばりましょう」（追い詰める励まし）

# 返答の構成ルール
1. 【感謝と労い・受容】：まずは話してくれたことへの感謝や日頃の労いを伝え、つらい気持ちを否定せず受け止めます。
2. 【ひら先生の視点・共感】：相談内容に丁寧に触れながら、「焦らなくていい理由」や「不登校を笑って越えていくための捉え方」を伝えます。
3. 【次の対話への問いかけ】：親御さんがホッと一息つけるよう、2〜3文程度の読みやすい長さで優しく締めくくります。

    let chatHistory = [
      { role: "user", parts: [{ text: "こんにちは" }] },
      { role: "model", parts: [{ text: "お帰りなさい。今日も本当にお疲れ様です。ここではどんな気持ちもそのまま吐き出して大丈夫ですよ。今日はどんなお話をしましょうか。" }] }
    ];

    function appendMessage(text, sender) {
      const messagesContainer = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      
      if (sender === 'bot') {
        msgDiv.innerHTML = `
          <img src="${AVATAR_IMG}" alt="ひら先生" class="msg-avatar-img">
          <div class="msg-bubble">${text}</div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="msg-bubble">${text}</div>
        `;
      }
      
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendQuickMessage(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const messagesContainer = document.getElementById('chatMessages');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg bot';
      loadingDiv.id = 'loadingMsg';
      loadingDiv.innerHTML = `
        <img src="${AVATAR_IMG}" alt="ひら先生" class="msg-avatar-img">
        <div class="msg-bubble"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
      `;
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      chatHistory.push({ role: "user", parts: [{ text: text }] });

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        loadingDiv.remove();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'bot');
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
        } else {
          appendMessage("申し訳ありません。少し通信が途切れてしまったようです。もう一度お話ししていただけますか？", 'bot');
        }
      } catch (err) {
        loadingDiv.remove();
        appendMessage("エラーが発生しました。通信環境をご確認ください。", 'bot');
      }
    }
  </script>
