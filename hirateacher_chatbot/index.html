<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひら先生ポケット｜不登校を笑いながら越えていく</title>
  <style>
    :root {
      /* ひら先生LP準拠：やさしいナチュラルグリーン系 */
      --primary-color: #4A7C72;
      --primary-soft: #EEF5F3;
      --primary-border: #C5D8D3;
      --user-bubble: #D5E4E0;
      --bot-bubble: #FFFFFF;
      --bg-gradient: linear-gradient(145deg, #F4F8F7 0%, #E9F1EF 100%);
      --text-main: #354542;
      --text-sub: #687A76;
      --border-color: #E2ECE9;
      --shadow-sm: 0 2px 10px rgba(74, 124, 114, 0.06);
      --shadow-md: 0 10px 30px rgba(74, 124, 114, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 94vh;
      max-height: 800px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .chat-header {
      background: #FFFFFF;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--border-color);
    }
    .header-profile { display: flex; align-items: center; gap: 12px; }
    .avatar-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-border);
      background: #FFFFFF;
      flex-shrink: 0;
    }
    .header-info h1 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }
    .header-info p {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .chat-messages {
      flex: 1;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #FAFBFB;
      scrollbar-width: thin;
    }
    .msg { display: flex; gap: 10px; max-width: 88%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--primary-border);
      flex-shrink: 0;
      margin-top: 2px;
      background: #FFFFFF;
    }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.68;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }
    .msg.bot .msg-bubble {
      background: var(--bot-bubble);
      color: var(--text-main);
      border-top-left-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .msg.user .msg-bubble {
      background: var(--user-bubble);
      color: #273835;
      border-top-right-radius: 4px;
    }
    .loading-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--primary-color);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .quick-chips {
      padding: 10px 14px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      background: #FAFBFB;
      border-top: 1px solid var(--border-color);
    }
    .chip-btn {
      background: #FFFFFF;
      border: 1px solid var(--primary-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .chip-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary-color);
    }
    .chat-input-area {
      padding: 12px 14px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      border: 1px solid var(--primary-border);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      background: #F4F8F7;
      color: var(--text-main);
    }
    .chat-input:focus {
      border-color: var(--primary-color);
      background: #FFFFFF;
    }
    .send-btn {
      background: var(--primary-color);
      border: none;
      color: #FFFFFF;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>

# 相談者へのお名前の呼びかけルール【重要・連呼禁止】
- 「〇〇さん」「〇〇様」といった伏字や記号は、絶対に画面に出力しないでください。

  * 通常の会話では名前を省いてそのまま自然に語りかけてください。

- もしお名前を名乗らずに悩み相談から入られた場合は、無理に聞き返さず、「お母さん」とお呼びするか、主語を省いた自然な語りかけでお話を聞いてください。

# ひら先生の根本スタンスと哲学
1. 【不登校を、笑いながら越えていく】
   - 不登校は決して暗くてつらいだけの経験でも、人生をあきらめる理由でもありません。「せっかく不登校になったんだから、この時間を有効に使おう。笑いながら越えていこう」と前を向ける社会を目指しています。
   - 学校に行くことは人生のゴールではなく、幸せになるための道筋の1つに過ぎません。ここから新しい人生が始まります。
2. 【子どもを変えるのではなく、お母さんが人生の主役に戻る】
   - 「子どもを変えよう」と必死になるほど苦しくなります。まず必要なのは、お母さん自身が元気を取り戻し、笑顔になることです。
   - お母さんが「私はどう生きたいか」を取り戻し、心に余白が生まれたとき、子どもをあたたかくどっしり見守れるようになります（例：「今日も休む」と言われても「そっか。今日はどう過ごす？」と穏やかに返せる境地）。

# 不登校を乗り越える「3つのステップ」
相談内容に応じて、以下の本質的な視点を優しく提示してください。
- STEP 1【正しく見立てる】：不登校はお母さんのメンタルだけで起きるわけではありません。経済、体調、栄養、睡眠、環境など、何に苦しんでいるかを多角的に見立てることが第一歩です。
- STEP 2【それぞれに合った支援を届ける】：お母さんを無闇にメンタル講座に誘導するのではなく、お金の悩みならFP、体調なら医師や栄養士など、各家庭の根本原因に応じた適切な専門支援に繋げることが大切です。
- STEP 3【子どもが自分の力で超えていく】：最後に不登校を乗り越えるのは子ども自身です。お母さんの役割は、子どもが自力で壁を越える過程を信じて見守れるよう、自身の体調・メンタル・生活の土台を整えることです。

# 言葉遣い・トーンの厳格ルール
- 常に上品で礼儀正しい敬語（です・ます調）を徹底してください。
- 「うん」「そうだね」「〜だよね」などのくだけた相づちやタメ口は固く禁止します。
- 「お母さんの育て方が悪かった」などと自責させたり、逆に「もっとがんばれ」「〜すべき」と追い詰める言葉は一切使いません。

# 表記ルール（ひらがな指定）
- 「温かい」→「あたたかい」
- 「子供」→「子ども」
- 「時」→「とき」
- 「頑張る」→「がんばる」
- 「辛い」→「つらい」

# 返答の長さ・テンポ【最重要・厳格制限】
- スマートフォンのLINE感覚で無理なく読めるよう、返答は必ず「1〜2文（多くても3文以内・60〜100文字程度）」にギュッと凝縮して短く答えてください。
- 背景の解説や理屈を長く語ることは禁止です。「共感の一言 ＋ 短い問いかけ」を基本とし、軽快なキャッチボールを心がけてください。
- 一度にたくさん伝えようとせず、お母さんの返信を待ってから次の一歩を伝えてください。

    let chatHistory = [
      { role: "user", parts: [{ text: "こんにちは" }] },
      { role: "model", parts: [{ text: "お帰りなさい。今日も本当にお疲れ様です。ここではどんな気持ちもそのまま吐き出して大丈夫ですよ。よかったら、お呼びするお名前（ニックネームでも大丈夫ですよ）を教えていただけますか？" }] }
    ];

    function appendMessage(text, sender) {
      const messagesContainer = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      
      if (sender === 'bot') {
        msgDiv.innerHTML = `
          <img src="${AVATAR_IMG}" alt="ひら先生" class="msg-avatar-img">
          <div class="msg-bubble">${text}</div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="msg-bubble">${text}</div>
        `;
      }
      
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendQuickMessage(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const messagesContainer = document.getElementById('chatMessages');
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg bot';
      loadingDiv.id = 'loadingMsg';
      loadingDiv.innerHTML = `
        <img src="${AVATAR_IMG}" alt="ひら先生" class="msg-avatar-img">
        <div class="msg-bubble"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
      `;
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      chatHistory.push({ role: "user", parts: [{ text: text }] });

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory
          })
        });

        const data = await response.json();
        loadingDiv.remove();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage(reply, 'bot');
          chatHistory.push({ role: "model", parts: [{ text: reply }] });
        } else {
          appendMessage("申し訳ありません。少し通信が途切れてしまったようです。もう一度お話ししていただけますか？", 'bot');
        }
      } catch (err) {
        loadingDiv.remove();
        appendMessage("エラーが発生しました。通信環境をご確認ください。", 'bot');
      }
    }
